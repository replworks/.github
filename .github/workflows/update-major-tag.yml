name: update-major-tag

on:
    release:
        types: [published]

jobs:
    tag:
        runs-on: ubuntu-latest

        permissions:
            # Allow the default GITHUB_TOKEN to push the moving major tag.
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}

            - name: Move major tag
              run: |
                  MAJOR_TAG="${RELEASE_TAG_NAME%%.*}"
                  git tag -f "$MAJOR_TAG" "$RELEASE_TAG_NAME"
                  git push origin "$MAJOR_TAG" --force
              env:
                  RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
